name: Bug 报告
description: 报告一个问题（数字不对、崩溃、输出错位等）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先跑一下 `node src/cli.ts doctor`，把输出贴到下面。

        ⚠️ **请打码路径里的用户名、项目名等隐私信息**，并确认没有粘贴任何 prompt 或代码内容。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 预期结果 vs 实际结果
      placeholder: |
        预期：report 显示 3 次调用
        实际：显示 5 次调用
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. node src/cli.ts scan
        2. node src/cli.ts report
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出
      description: 运行 `node src/cli.ts doctor` 的结果
      render: text

  - type: input
    id: node-version
    attributes:
      label: Node 版本
      placeholder: 例如 24.9.0（node -v）

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他（请说明）

  - type: textarea
    id: logs
    attributes:
      label: 报错 / 相关输出
      render: text
