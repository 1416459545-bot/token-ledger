name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']
    env:
      TOKEN_LEDGER_HOME: ${{ github.workspace }}/.tmp/ledger
      CLAUDE_PROJECTS_DIR: ${{ github.workspace }}/test/fixtures/claude
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        run: |
          node --version
          node -e "console.log('typescript support:', process.features.typescript ?? 'undefined')"

      # 注意：必须 set -o pipefail，否则 | tee 会把测试的失败码吞掉，变成假绿
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          node --test test 2>&1 | tee test.log

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Node ${{ matrix.node }}"
            echo '```'
            tail -n 60 test.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test on fixtures
        run: |
          node src/cli.ts doctor
          node src/cli.ts scan
          node src/cli.ts report --month 2026-11
          node src/cli.ts export --format csv > /dev/null
