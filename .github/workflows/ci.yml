name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']
    env:
      TOKEN_LEDGER_HOME: ${{ github.workspace }}/.tmp/ledger
      CLAUDE_PROJECTS_DIR: ${{ github.workspace }}/test/fixtures/claude
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        run: |
          node --version
          node -e "console.log('typescript support:', process.features.typescript ?? 'undefined')"

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # node --test 用默认发现（test/**/*.test.*）。
      # 不要用 `node --test test`：Node 24 不把目录当目录，会报 MODULE_NOT_FOUND。
      # 必须 set -o pipefail，否则 | tee 会把失败码吞掉变成假绿。
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          node --test 2>&1 | tee test.log

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Node ${{ matrix.node }}"
            echo '```'
            tail -n 60 test.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test on fixtures
        run: |
          node src/cli.ts doctor
          node src/cli.ts scan
          node src/cli.ts report --month 2026-11
          node src/cli.ts export --format csv > /dev/null
          node src/cli.ts export --format html --out /tmp/report.html
          test -s /tmp/report.html
          # 编译产物也要能跑（用户装到的就是它）
          node dist/cli.js --version
          node dist/cli.js report --month 2026-11 > /dev/null
          # 验证 GitHub 评论正文能生成（不发请求）
          node src/cli.ts comment --repo example/repo --issue 1 --dry-run | grep -q "token-ledger:comment"
