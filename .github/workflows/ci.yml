name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']
    env:
      TOKEN_LEDGER_HOME: ${{ github.workspace }}/.tmp/ledger
      CLAUDE_PROJECTS_DIR: ${{ github.workspace }}/test/fixtures/claude
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test "test/**/*.test.ts"

      - name: Smoke test on fixtures
        run: |
          node src/cli.ts doctor
          node src/cli.ts scan
          node src/cli.ts report --month 2026-11
          node src/cli.ts export --format csv
