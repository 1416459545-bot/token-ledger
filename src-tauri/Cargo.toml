[package]
name = "token-ledger-app"
version = "1.0.0"
description = "Token 账本 桌面版"
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_ledger_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "token-ledger-app"
path = "src/main.rs"

[[bin]]
name = "tlscan"
path = "src/bin/tlscan.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true


